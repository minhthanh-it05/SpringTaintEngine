name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and package
        run: mvn -B package

      - name: Self-scan the sample project (SARIF)
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          java -jar "$JAR" src/main/resources/samples --format=console,sarif --out=target/taint-report

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/taint-report.sarif
